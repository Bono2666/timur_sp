{% extends 'layouts/base.html' %}

{% block title %} Data Satuan {% endblock title %}

{% block content %}

<div class="container-fluid py-0">
    <div class="row">
        <div class="col-12">
            <div class="card mb-4 p-4">
                <div class="row mb-4">
                    <div class="col-6 d-flex align-items-center">
                        <h4 class="mb-0">Daftar Satuan</h4>
                    </div>
                    <div class="col-6 text-end">
                        <a class="btn btn-sm bg-gradient-primary mb-0 {% if not btn.add and not request.user.is_superuser %}disabled{% endif %}" href="{% url 'unit-add' %}"><i class="fas fa-plus"></i>&nbsp;&nbsp;Tambah Satuan</a>
                    </div>
                </div>
                <div class="card-body px-0 pt-0 pb-2">
                    <div class="table-responsive p-0">
                        <table class="table hover align-items-center mb-0" id="myTable">
                            <thead>
                                <tr>
                                    <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Kode</th>
                                    <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 ps-2">Nama Satuan</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for item in data %}
                                <tr data-href="{% url 'unit-view' item.pk %}" class="cursor-pointer">
                                    <td><h6 class="mb-0 text-sm">{{ item.code }}</h6></td>
                                    <td><h6 class="mb-0 text-sm">{{ item.name }}</h6></td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock content %}

{% block javascripts %}

<script>
    $(document).ready( function () {
        $('#myTable').DataTable({
            'language': {
                'search': 'Cari: ',
                'info': 'Menampilkan _START_ sampai _END_ dari _TOTAL_ data',
                'lengthMenu': 'Tampilkan _MENU_ data',
                'infoEmpty': '',
                'zeroRecords': 'Tidak ada data',
                'paginate': { 'next': 'Selanjutnya', 'previous': 'Sebelumnya' }
            }
        });

        $(document).on('click', 'tbody tr', function() {
            if ($(this).data('href')) { window.location = $(this).data('href'); }
        });
    } );
</script>

{% endblock javascripts %}
