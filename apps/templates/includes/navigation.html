{% load static %}
{% load user_agents %}
<!-- Navbar -->
<nav class="navbar navbar-main navbar-expand-lg px-0 mx-4 shadow-none border-radius-xl" id="navbarBlur" navbar-scroll="true" style="z-index: 1050;">
  <div class="container-fluid py-1 px-3">
    <div class="d-flex align-items-center flex-grow-1">
      <!-- Tombol buka/tutup sidebar (mobile & tablet, < xl) — harus di LUAR
           .collapse agar selalu bisa diklik. soft-ui-dashboard.js mengikat
           toggleSidenav() ke id ini. -->
      <button type="button" class="btn btn-sm border-0 bg-transparent p-0 me-2 mb-0 text-body d-xl-none"
              id="iconNavbarSidenav" aria-label="Buka atau tutup menu samping"
              aria-controls="sidenav-main" aria-expanded="false">
        <i class="fas fa-bars fa-lg" aria-hidden="true"></i>
      </button>
      <nav aria-label="app">
        <ol class="breadcrumb bg-transparent mb-0 pb-0 pt-1 px-0 me-sm-6 me-5">
          <li class="text-sm font-weight-bold text-dark active" aria-current="page">
            TSP Warehouse
          </li>
        </ol>
      </nav>
    </div>
    <!-- Toggler menu kanan (muncul otomatis di bawah breakpoint lg).
         Soft UI menonaktifkan background-image bawaan Bootstrap dan
         mengharuskan tiga bar di dalamnya. -->
    <button class="navbar-toggler border-0 mb-0" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbar" aria-controls="navbar" aria-expanded="false"
            aria-label="Buka menu pengguna">
      <span class="navbar-toggler-icon">
        <span class="navbar-toggler-bar bar1"></span>
        <span class="navbar-toggler-bar bar2"></span>
        <span class="navbar-toggler-bar bar3"></span>
      </span>
    </button>
    <div class="collapse navbar-collapse mt-sm-0 mt-2 me-md-0 me-sm-4" id="navbar">
      <ul class="navbar-nav  ms-auto">
        <li class="nav-item d-flex align-items-center">
          <div class="nav-link text-body font-weight-bold px-0">
            <i class="fa fa-user me-sm-1"></i>
            <span class="d-sm-inline me-3">{% if request|is_mobile %}&nbsp;{{ request.user.username|truncatechars:10 }}{% else %}{{ request.user.username }}{% endif %}</span>
          </div>
        </li>
        
        <button class="font-weight-bold button text-body text-sm ps-4 border-0 bg-transparent" data-bs-toggle="modal" {% if crud != 'add' and crud != 'update' %}data-bs-target="#confirm"{% endif %}>
          Logout
        </button>

        <li class="nav-item pe-0 px-3 d-flex align-items-center">
          <a {% if crud != 'add' and crud != 'update' %}href="{% url 'change-password' %}"{% endif %} class="nav-link button text-body p-0 m-0" data-tooltip="Ubah Password">
            <i class="fa fa-lock fixed-plugin-button-nav cursor-pointer"></i>
          </a>
        </li>
        <li class="nav-item pe-2 px-3 d-flex align-items-center">
          <label for="theme-switch" class="nav-link text-body p-0 m-0" data-tooltip="Theme">
            <i class="fa fa-sun fixed-plugin-button-nav cursor-pointer" id="theme-indicator"></i>
          </label>
          <input type="checkbox" class="d-none" id="theme-switch"/>
        </li>

        <li class="nav-item d-none d-xl-flex ps-3 d-flex align-items-center">
          <a href="javascript:;" class="nav-link text-body p-0 m-0" id="sidebarCollapseBtn" data-tooltip="Perkecil Sidebar">
            <div class="sidenav-toggler-inner">
              <i class="fa-solid fa-bars" id="sidebarCollapseIcon"></i>
            </div>
          </a>
        </li>
        
      </ul>
    </div>
  </div>
</nav>
<!-- End Navbar -->
<div class="modal fade" id="confirm" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="ModalLabel">Konfirmasi</h5>
      </div>
      <div class="modal-body border-bottom-0">
        Anda yakin ingin keluar dari aplikasi?
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-sm bg-gradient-dark" data-bs-dismiss="modal">Batal</button>
        <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
          <button type="submit" role="button" class="btn btn-sm bg-gradient-primary text-white">Ya
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<div>
  <img src="/apps/static/img/transparent-logo.png" alt="TSP Warehouse" class="position-fixed h-100 w-30 d-lg-block top-0 {% if request|is_mobile %}w-80 translate-middle-x{% else %}w-30 d-none ms-n7{% endif %} start-50 opacity-2" style="object-fit: contain;">
</div>

<script>
(function() {
  function initNavTooltips() {
    document.querySelectorAll('[data-tooltip]').forEach(function(el) {
      if (el._tipInit) return;
      el._tipInit = true;
      var tip = null;
      el.addEventListener('mouseenter', function() {
        tip = document.createElement('div');
        tip.textContent = el.getAttribute('data-tooltip');
        tip.style.cssText = 'position:fixed;z-index:99999;background:#333;color:#fff;padding:4px 10px;border-radius:4px;font-size:12px;pointer-events:none;white-space:nowrap;';
        document.body.appendChild(tip);
        var rect = el.getBoundingClientRect();
        tip.style.left = (rect.left + rect.width / 2 - tip.offsetWidth / 2) + 'px';
        tip.style.top = (rect.top - tip.offsetHeight - 6) + 'px';
        setTimeout(function() { if (tip && tip.parentNode) tip.remove(); tip = null; }, 2000);
      });
      el.addEventListener('mouseleave', function() {
        if (tip && tip.parentNode) tip.remove();
        tip = null;
      });
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initNavTooltips);
  } else {
    initNavTooltips();
  }
})();
</script>

{{ redirect_to_login_immediately }}
